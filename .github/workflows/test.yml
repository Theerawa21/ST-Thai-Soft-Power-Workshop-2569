name: Test registration system

on:
  push:
    branches:
      - feature/registration-system-v1
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Smoke test deployed Apps Script API
        run: |
          curl -LfsS 'https://script.google.com/macros/s/AKfycbzu55ixmbX67s4gjgVjShwYyHtD37R1Xu1Ed-zvxJwVz6gfVDu1vx2L7RHT7No9ak1g/exec' -o /tmp/api.json
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('/tmp/api.json','utf8')); if(!r.ok || r.data?.status!=='online') { console.error(r); process.exit(1); } console.log(r);"
