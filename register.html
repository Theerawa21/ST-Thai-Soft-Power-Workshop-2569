<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สมัครอบรม | ST Thai Soft Power Workshop 2569</title><link rel="stylesheet" href="assets/css/app.css"></head><body>
<header class="site-header"><nav class="nav"><a class="brand" href="index.html"><span class="brand-mark">ST</span><span class="brand-text"><strong>ระบบสมัครอบรม</strong><span>ST Thai Soft Power Workshop 2569</span></span></a><div class="nav-links"><a href="status.html">ตรวจสอบสถานะ</a></div></nav></header>
<main class="container"><section class="page-hero"><h1>สมัครเข้าร่วม Workshop</h1><p>กรอกข้อมูลตามจริง 1 คนต่อ 1 รายการสมัคร</p></section><div id="message" class="message" hidden></div><form id="registrationForm" class="card"><div class="form-grid">
<div class="form-field"><label for="student_id">รหัสนักเรียน *</label><input id="student_id" name="student_id" required autocomplete="off"></div>
<div class="form-field"><label for="prefix">คำนำหน้า *</label><select id="prefix" name="prefix" required><option value="">เลือก</option><option>นาย</option><option>นางสาว</option></select></div>
<div class="form-field"><label for="first_name">ชื่อ *</label><input id="first_name" name="first_name" required></div><div class="form-field"><label for="last_name">นามสกุล *</label><input id="last_name" name="last_name" required></div>
<div class="form-field"><label for="nickname">ชื่อเล่น *</label><input id="nickname" name="nickname" required></div><div class="form-field"><label for="phone">เบอร์โทรศัพท์ *</label><input id="phone" name="phone" inputmode="tel" required placeholder="08xxxxxxxx"></div>
<div class="form-field"><label for="grade">ระดับชั้น *</label><select id="grade" name="grade" required><option value="">เลือก</option><option>ม.4</option><option>ม.5</option><option>ม.6</option></select></div><div class="form-field"><label for="room">ห้อง *</label><input id="room" name="room" required inputmode="numeric"></div>
<div class="form-field"><label for="number">เลขที่ *</label><input id="number" name="number" required inputmode="numeric"></div><div class="form-field"><label for="program">แผนการเรียน *</label><input id="program" name="program" required placeholder="เช่น วิทย์–คณิต"></div>
<div class="form-field form-field--full"><label for="registration_type">ประเภทผู้สมัคร *</label><select id="registration_type" name="registration_type" required><option value="">เลือกประเภท</option><option value="MARKET_REP">ตัวแทนกลุ่ม Green Business Market</option><option value="SCI_MATH">นักเรียนแผนวิทย์–คณิตที่สนใจ</option></select><small>ผู้สมัครแบบตัวแทนตลาด แต่ละกลุ่มส่ง 3–4 คน</small></div>
</div>
<fieldset id="marketFields" class="fieldset-block" hidden><legend>ข้อมูลกลุ่ม Green Business Market</legend><div class="form-grid"><div class="form-field"><label for="group_name">ชื่อกลุ่ม / ชื่อร้าน</label><input id="group_name" name="group_name"></div><div class="form-field"><label for="product_type">ประเภทสินค้า</label><select id="product_type" name="product_type"><option value="">เลือก</option><option>อาหาร</option><option>เครื่องดื่ม</option><option>ขนม</option></select></div><div class="form-field form-field--full"><label for="product_name">ชื่อเมนู / แนวคิดสินค้า</label><input id="product_name" name="product_name"></div><div class="form-field form-field--full"><label for="soft_power_concept">อัตลักษณ์ Thai Soft Power ที่ต้องการนำเสนอ</label><textarea id="soft_power_concept" name="soft_power_concept"></textarea></div></div></fieldset>
<div class="button-row"><button class="button button--accent" type="submit">ยืนยันการสมัคร</button><a class="button button--ghost" href="index.html">กลับหน้าแรก</a></div></form></main><footer class="footer"><div class="container">ค่าลงทะเบียน 100 บาท/คน • ชำระที่ฝ่ายวิชาการหลังสมัคร</div></footer><script type="module" src="assets/js/register.js"></script></body></html>
