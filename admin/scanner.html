<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>รับชำระเงิน | ฝ่ายวิชาการ</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/css/app.css"></head><body>
<div class="admin-shell"><aside class="admin-side"><h2 style="color:#fff">ฝ่ายวิชาการ</h2><a href="index.html">Dashboard</a><a href="scanner.html">รับชำระเงิน</a><a href="checkin.html">Check-in</a><a href="../index.html">เว็บไซต์นักเรียน</a></aside><main class="admin-main"><div class="container" style="width:100%;max-width:900px"><h1 style="font-size:2.4rem;margin-top:0">สแกน QR / รับชำระเงิน</h1><div id="scannerMessage" class="message" hidden></div><div class="panel"><div id="reader" class="scanner-box"><div style="text-align:center"><strong>เปิดกล้องเพื่อสแกน QR</strong><p class="help">หากเปิดกล้องไม่ได้ สามารถกรอกเลขที่สมัครด้านล่าง</p></div></div><div class="actions"><button id="startScanner" class="btn btn-primary" type="button">เปิดกล้อง</button></div><div class="field" style="margin-top:18px"><label for="manualId">เลขที่สมัคร</label><div style="display:flex;gap:10px"><input id="manualId" placeholder="GBM2569-001"><button id="lookupManual" class="btn btn-secondary" type="button">ค้นหา</button></div></div></div>
<div id="paymentPanel" class="panel" style="margin-top:22px" hidden><h3>ข้อมูลผู้สมัคร</h3><div class="summary-list"><div class="summary-row"><span class="summary-label">เลขที่สมัคร</span><span id="pId" class="summary-value"></span></div><div class="summary-row"><span class="summary-label">ชื่อ</span><span id="pName" class="summary-value"></span></div><div class="summary-row"><span class="summary-label">ชั้น/ห้อง</span><span id="pClass" class="summary-value"></span></div><div class="summary-row"><span class="summary-label">สถานะ</span><span id="pStatus" class="summary-value"></span></div><div class="summary-row"><span class="summary-label">ค่าลงทะเบียน</span><span class="summary-value">100 บาท</span></div></div><div class="form-section"><h3>วิธีชำระเงิน</h3><div class="radio-row"><label class="choice"><input type="radio" name="payMethod" value="CASH" checked><span>เงินสด</span></label><label class="choice"><input type="radio" name="payMethod" value="TRANSFER"><span>โอนเงิน</span></label></div><div id="transferFields" class="form-grid" style="margin-top:16px" hidden><div class="field"><label for="transferDate">วันที่โอน</label><input id="transferDate" type="date"></div><div class="field"><label for="transferTime">เวลาโอน</label><input id="transferTime" type="time"></div><div class="field full"><label for="paymentNote">หมายเหตุ</label><textarea id="paymentNote"></textarea></div></div><div class="actions"><button id="confirmPayment" class="btn btn-primary" type="button">ยืนยันรับเงิน 100 บาท</button></div></div><div id="paymentResult" class="notice" hidden></div></div></div></main></div>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script><script type="module" src="../assets/js/scanner.js"></script></body></html>
