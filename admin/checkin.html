<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Check-in | ฝ่ายวิชาการ</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/css/app.css"></head><body>
<div class="admin-shell"><aside class="admin-side"><h2 style="color:#fff">ฝ่ายวิชาการ</h2><a href="index.html">Dashboard</a><a href="scanner.html">รับชำระเงิน</a><a href="checkin.html">Check-in</a><a href="../index.html">เว็บไซต์นักเรียน</a></aside><main class="admin-main"><div class="container" style="width:100%;max-width:900px"><h1 style="font-size:2.4rem;margin-top:0">Check-in วันอบรม</h1><div id="checkinMessage" class="message" hidden></div><div class="panel"><div id="checkinReader" class="scanner-box"><div style="text-align:center"><strong>สแกน QR เดิมของนักเรียน</strong><p class="help">ระบบจะอนุญาต Check-in เฉพาะผู้ที่ชำระเงินแล้ว</p></div></div><div class="actions"><button id="startCheckinScanner" class="btn btn-primary" type="button">เปิดกล้อง</button></div><div class="field" style="margin-top:18px"><label for="checkinManualId">เลขที่สมัคร</label><div class="inline-action"><input id="checkinManualId" placeholder="GBM2569-001"><button id="checkinManualButton" class="btn btn-secondary" type="button">Check-in</button></div></div></div><div id="checkinResult" class="panel" style="margin-top:22px" hidden><h3>ผลการ Check-in</h3><div class="summary-list"><div class="summary-row"><span class="summary-label">เลขที่สมัคร</span><span id="cId" class="summary-value"></span></div><div class="summary-row"><span class="summary-label">ชื่อ</span><span id="cName" class="summary-value"></span></div><div class="summary-row"><span class="summary-label">ชั้น/ห้อง</span><span id="cClass" class="summary-value"></span></div><div class="summary-row"><span class="summary-label">เวลา</span><span id="cTime" class="summary-value"></span></div><div class="summary-row"><span class="summary-label">สถานะ</span><span class="status-pill paid">Check-in แล้ว</span></div></div></div></div></main></div>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script><script type="module" src="../assets/js/checkin.js"></script></body></html>
